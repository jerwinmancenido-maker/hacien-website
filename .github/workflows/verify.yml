# HACIEN website — verify (the repo's first CI workflow).
# Runs the same checks the repo's AGENTS.md asks for before every
# push: install, lint, typecheck is part of the build, test, build.
# Kept lean on purpose: one job, npm cache on, superseded PR runs
# cancelled — this is a private repo and Actions minutes are pooled.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
